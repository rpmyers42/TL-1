<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12131A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TL-1">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignores the manifest icons for Add to Home Screen and wants this. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>TL-1</title>

<!-- NO EXTERNAL REQUESTS ON PURPOSE.
     v2 pulled Barlow Condensed from Google Fonts. At the velodrome there is
     often no signal, and a webfont request that hangs delays first paint on
     the one screen you actually need. Everything here is local: iOS and macOS
     resolve Avenir Next Condensed from disk, Android falls back to the system
     sans, and the page renders with no network at all. -->
<style>
:root{
  --board:#12131A; --panel:#1B1D27; --panel-2:#22252F; --rail:#3A3F4E;
  --pine:#E8DCC8; --dim:#9A9284;
  --sprint:#E23B3B;   /* speed  */
  --stayer:#4A8FE7;   /* cadence */
  --watt:#E0A93B;     /* power  */
  --ok:#5BC17F; --warn:#E0A93B;
  --f-num:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Roboto Condensed",
          system-ui,-apple-system,sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:48px;         /* minimum touch target, thumbs on a bike */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--board);color:var(--pine);
  font-family:var(--f-ui);font-size:15px;line-height:1.4;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:8px 14px;
  border-bottom:1px solid var(--rail);flex:0 0 auto}
.wordmark{font-family:var(--f-num);font-weight:700;font-size:25px;
  letter-spacing:.04em;text-transform:uppercase;line-height:1}
.wordmark span{color:var(--sprint)}
.state{display:flex;align-items:center;gap:6px;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);min-width:0}
.state b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rail);flex:0 0 auto}
.dot.live{background:var(--ok)}
.dot.busy{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.dot.bad{background:var(--sprint)}
@keyframes pulse{50%{opacity:.3}}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:5px;
  border:1px solid var(--rail);color:var(--dim);flex:0 0 auto}
.pill.low{border-color:var(--sprint);color:var(--sprint)}
.spacer{margin-left:auto}

/* ---------- buttons ---------- */
button{font-family:var(--f-ui);font-size:15px;font-weight:500;color:var(--pine);
  background:var(--panel-2);border:1px solid var(--rail);border-radius:8px;
  padding:0 16px;min-height:var(--tap);cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:2px solid var(--stayer);outline-offset:2px}
button:disabled{opacity:.3;cursor:not-allowed}
button.primary{background:var(--sprint);border-color:var(--sprint);color:#fff;font-weight:600}
button.on{background:var(--pine);border-color:var(--pine);color:var(--board);font-weight:600}
button.small{min-height:40px;padding:0 12px;font-size:13.5px}
button.danger{border-color:var(--sprint);color:var(--sprint)}
button.armed{background:var(--sprint);border-color:var(--sprint);color:#fff}

/* ---------- readout ---------- */
.readout{display:grid;grid-template-columns:1fr 1fr;flex:0 0 auto;
  border-bottom:1px solid var(--rail)}
.cell{padding:10px 14px 8px;min-width:0;border-right:1px solid var(--rail)}
.cell:last-child{border-right:0}
.val{font-family:var(--f-num);font-weight:600;font-size:clamp(44px,15vw,76px);
  line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:block}
.cell.s .val{color:var(--sprint)} .cell.c .val{color:var(--stayer)}
.unit{font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);display:block;margin-top:4px}

.strip{display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto;
  border-bottom:1px solid var(--rail);background:var(--panel)}
.scell{padding:7px 10px;border-right:1px solid var(--rail);min-width:0;text-align:center}
.scell:last-child{border-right:0}
.sval{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;
  display:block;white-space:nowrap;overflow:hidden}
.scell.p .sval{color:var(--watt)}
.slab{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  display:block;margin-top:2px}

/* ---------- plot ---------- */
.plot{position:relative;flex:1 1 auto;min-height:150px;background:var(--board)}
canvas{display:block;width:100%;height:100%;touch-action:none}
/* The canvas reserves PAD.t at the top for these, so if you change the
   height of the tool buttons, change PAD.t to match or they will sit on
   top of the plot. */
.plot-tools{position:absolute;top:7px;right:8px;display:flex;gap:5px}
.plot-tools button{min-height:38px;padding:0 12px;font-size:15px;
  background:rgba(27,29,39,.92);border-color:var(--rail)}
.plot-tools button#btnFollow{font-size:13px;min-width:74px}
/* Must out-specify .plot-tools button, which is defined after button.on
   and would otherwise take the background back. */
.plot-tools button.on{background:var(--pine);border-color:var(--pine);
  color:var(--board);font-weight:600}
.legend{position:absolute;top:13px;left:13px;display:flex;gap:12px;
  align-items:center;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);pointer-events:none}
.legend i{display:inline-block;width:13px;height:2px;vertical-align:middle;margin-right:4px}
.badge{color:var(--pine);font-weight:600}

/* ---------- controls ---------- */
.controls{border-top:1px solid var(--rail);padding:10px 14px;flex:0 0 auto;
  display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
#btnRec{flex:1 1 auto;font-size:17px}
input[type=text]{font-family:var(--f-ui);font-size:16px;color:var(--pine);
  background:var(--panel-2);border:1px solid var(--rail);border-radius:8px;
  padding:0 12px;min-height:var(--tap);min-width:0;flex:1 1 90px}
input[type=text]:focus{outline:2px solid var(--stayer);outline-offset:1px}
.hint{font-size:12.5px;color:var(--dim)}
.tag{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);flex:0 0 auto;width:48px}

/* ---------- panels ---------- */
details{border-top:1px solid var(--rail);flex:0 0 auto}
summary{padding:13px 14px;cursor:pointer;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);list-style:none;
  display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:15px}
details[open] summary::after{content:"\2212"}
.panel{padding:0 14px 13px;display:flex;flex-direction:column;gap:9px}
.gauge{height:7px;background:var(--panel-2);border:1px solid var(--rail);
  border-radius:4px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--stayer);
  transition:width .3s ease}
.sessions{display:flex;flex-direction:column;gap:6px}
.sessions button{text-align:left;padding:9px 12px;min-height:0;font-size:13.5px;
  display:block;line-height:1.3}
.sessions button small{display:block;color:var(--dim);font-size:11px;
  letter-spacing:.04em;margin-top:3px;font-family:var(--f-mono)}
.sessions button.on small{color:rgba(18,19,26,.7)}
#log{font-family:var(--f-mono);font-size:11px;line-height:1.55;
  background:var(--panel);color:var(--dim);max-height:180px;overflow:auto;
  padding:9px 14px 12px;white-space:pre-wrap;word-break:break-all;margin:0;
  -webkit-overflow-scrolling:touch}
#log .mk{color:var(--pine)} #log .er{color:var(--sprint)}

.notice{margin:0;padding:13px 14px;background:var(--panel);
  border-bottom:1px solid var(--rail);font-size:13.5px;color:var(--dim)}
.notice strong{color:var(--pine);font-weight:600}
.notice code{font-family:var(--f-mono);font-size:12.5px;color:var(--pine)}
.hide{display:none!important}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="wordmark">TL<span>&ndash;</span>1</div>
  <div class="state"><span class="dot" id="dot"></span><b id="stateTxt">Not connected</b></div>
  <div class="spacer"></div>
  <span class="pill hide" id="bat">--</span>
  <button id="btnConnect" class="primary small">Connect</button>
</div>

<p class="notice hide" id="notice"></p>

<div class="readout">
  <div class="cell s"><span class="val" id="vSpeed">&ndash;&ndash;</span><span class="unit">km/h</span></div>
  <div class="cell c"><span class="val" id="vCad">&ndash;&ndash;</span><span class="unit">cadence rpm</span></div>
</div>

<div class="strip">
  <div class="scell"><span class="sval" id="vTime">0:00</span><span class="slab">elapsed</span></div>
  <div class="scell"><span class="sval" id="vDist">0</span><span class="slab">metres</span></div>
  <div class="scell p"><span class="sval" id="vPwr">&ndash;&ndash;</span><span class="slab">watts</span></div>
  <div class="scell"><span class="sval" id="vPts">0</span><span class="slab">samples</span></div>
</div>

<div class="plot">
  <canvas id="cv"></canvas>
  <div class="legend">
    <span class="badge" id="badge">Live</span>
    <span><i style="background:var(--sprint)"></i>speed</span>
    <span><i style="background:var(--stayer)"></i>cadence</span>
  </div>
  <div class="plot-tools">
    <button id="btnOut" aria-label="Show more time">&minus;</button>
    <button id="btnIn" aria-label="Show less time">&plus;</button>
    <button id="btnFollow" class="on small">Follow</button>
  </div>
</div>

<div class="controls">
  <div class="row">
    <button id="btnRec" class="primary" disabled>Record</button>
    <button id="btnMark" disabled>Mark</button>
  </div>
  <div class="row">
    <input type="text" id="secName" placeholder="section name" autocomplete="off"
           spellcheck="false" enterkeyhint="go">
    <button id="btnSec" disabled>Set</button>
  </div>
  <div class="row hide" id="reviewRow">
    <span class="hint" id="reviewTxt"></span>
    <div class="spacer"></div>
    <button id="btnBackLive" class="small">Back to live</button>
  </div>
</div>

<details id="dFlash">
  <summary>Flash log</summary>
  <div class="panel">
    <div class="hint" id="flashTxt">not read yet</div>
    <div class="gauge"><i id="gaugeFill"></i></div>
    <div class="row wrap">
      <button id="btnFree"  class="small" disabled>Refresh</button>
      <button id="btnTail"  class="small" disabled>Last 32 KB</button>
      <button id="btnTail2" class="small" disabled>Last 128 KB</button>
      <button id="btnDump"  class="small" disabled>Load all</button>
    </div>
    <div class="row wrap">
      <button id="btnSave"  class="small" disabled>Save CSV</button>
      <button id="btnOpen"  class="small">Open CSV</button>
      <div class="spacer"></div>
      <button id="btnErase" class="small danger" disabled>Erase log</button>
    </div>
    <input type="file" id="fileIn" accept=".csv,.txt,text/csv,text/plain" hidden>
    <div class="sessions hide" id="sessions"></div>
  </div>
</details>

<details id="dSetup">
  <summary>Setup</summary>
  <div class="panel">
    <div class="row wrap">
      <span class="tag">Circ</span>
      <input type="text" id="circVal" inputmode="numeric" placeholder="2100">
      <button id="btnCirc" class="small" disabled>Set mm</button>
    </div>
    <div class="row wrap">
      <span class="tag">Gear</span>
      <input type="text" id="gearVal" placeholder="63 14">
      <button id="btnGear" class="small" disabled>Declare</button>
    </div>
    <div class="hint">Gear is only an annotation, and some firmware revisions
      drop it entirely. If the logger answers "unknown command", ignore it.</div>
    <div class="row wrap">
      <button id="btnStatus"  class="small" disabled>Status</button>
      <button id="btnRescan"  class="small" disabled>Rescan sensors</button>
      <button id="btnForget"  class="small danger" disabled>Forget MACs</button>
    </div>
  </div>
</details>

<details id="dStream">
  <summary>Stream</summary>
  <pre id="log"></pre>
</details>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════════════════
   TL-1 receiver  v3
   ------------------------------------------------------------------------
   WHAT WENT WRONG IN v2, since each fix below exists for a reason:

   1. Nothing was memory bounded. `raw` collected every line ever received
      and was never trimmed, and the import path built one giant string by
      concatenating line by line, then kept it resident alongside the
      parsed copies. A full 2 MB `dump` meant three copies of the log in
      a WKWebView with a hard memory ceiling, so iOS killed the tab and it
      reloaded. That is the "opens then closes randomly".

   2. send() was async and never awaited, and open() fired two commands
      back to back. Web Bluetooth permits ONE GATT operation at a time, so
      the second threw "GATT operation already in progress" and every fast
      tap after it did the same. All writes now go through one queue.

   3. The sample parser demanded exactly 11 columns. rev H wrote 11, the
      gear-less revisions write 9 or 10, so nothing parsed and the graph
      sat empty. Columns are now read from the header line each session
      writes, with a width fallback for fragments that start mid-log.

   4. No NaN guard anywhere. Math.max(10,...speeds) with one NaN makes the
      Y scale NaN and blanks the whole graph, and spreading a long array
      into Math.max can throw outright. Running max now, finite only.

   5. No decimation. Zoomed out to two hours it tried to stroke tens of
      thousands of points per frame onto a 300 px canvas.
   ════════════════════════════════════════════════════════════════════════ */

/* Nordic UART Service, as advertised by the logger's Bluefruit BLEUart.
   Web Bluetooth requires lowercase UUIDs. */
const NUS    = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";  // we write
const NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";  // logger notifies

/* Memory ceilings. The flash log on the logger is the real record; this
   page is a dashboard, so dropping the oldest live samples costs nothing
   that matters. At the decimated 1 Hz the firmware now sends, 14400
   samples is four hours. */
const LIVE_CAP    = 14400;
const RAW_CAP     = 40000;    // lines retained for Save CSV
const TRIM_CHUNK  = 2000;     // trim in blocks, not one at a time
const REVIEW_CAP  = 80000;    // per imported session
const BLE_KB_S    = 2.5;      // measured-ish NUS throughput, for estimates

const $ = id => document.getElementById(id);
const el = {
  dot:$("dot"), state:$("stateTxt"), notice:$("notice"), connect:$("btnConnect"),
  bat:$("bat"),
  speed:$("vSpeed"), cad:$("vCad"),
  time:$("vTime"), dist:$("vDist"), pwr:$("vPwr"), pts:$("vPts"),
  rec:$("btnRec"), mark:$("btnMark"), sec:$("btnSec"), secName:$("secName"),
  out:$("btnOut"), in:$("btnIn"), follow:$("btnFollow"), badge:$("badge"),
  cv:$("cv"), log:$("log"),
  free:$("btnFree"), tail:$("btnTail"), tail2:$("btnTail2"), dump:$("btnDump"),
  save:$("btnSave"), erase:$("btnErase"),
  flashTxt:$("flashTxt"), gaugeFill:$("gaugeFill"), sessions:$("sessions"),
  reviewRow:$("reviewRow"), reviewTxt:$("reviewTxt"), backLive:$("btnBackLive"),
  open:$("btnOpen"), fileIn:$("fileIn"),
  circVal:$("circVal"), circ:$("btnCirc"), gearVal:$("gearVal"), gear:$("btnGear"),
  status:$("btnStatus"), rescan:$("btnRescan"), forget:$("btnForget"),
  dFlash:$("dFlash"),
};

/* ═══ traces ═════════════════════════════════════════════════════════════
   Samples live in parallel plain arrays rather than an array of objects.
   Same code clarity, a fraction of the memory, and trimming is a splice
   instead of thousands of individual shifts. */
function newTrace(label){
  return { label,
    t:[], sp:[], cd:[], pw:[], wr:[], we:[], cr:[], ce:[], gr:[],
    markers:[], raw:[], rawCut:false,
    maxSp:0, header:null, cols:null, circ:null, wr0:null };
}

const liveTrace = newTrace("live");
let reviewTrace = null;
let mode = "live";
const T = () => (mode === "review" && reviewTrace) ? reviewTrace : liveTrace;

function pushSample(tr, s, cap){
  tr.t.push(s.t); tr.sp.push(s.sp); tr.cd.push(s.cd); tr.pw.push(s.pw);
  tr.wr.push(s.wr); tr.we.push(s.we); tr.cr.push(s.cr); tr.ce.push(s.ce);
  tr.gr.push(s.gr);
  if(Number.isFinite(s.sp) && s.sp > tr.maxSp) tr.maxSp = s.sp;
  if(tr.wr0 === null && Number.isFinite(s.wr)) tr.wr0 = s.wr;
  if(tr.t.length > cap + TRIM_CHUNK) trimTrace(tr, TRIM_CHUNK);
}

const SERIES = ["t","sp","cd","pw","wr","we","cr","ce","gr"];

function trimTrace(tr, n){
  SERIES.forEach(k=>tr[k].splice(0, n));
  const t0 = tr.t.length ? tr.t[0] : 0;
  while(tr.markers.length && tr.markers[0].t < t0) tr.markers.shift();
  // running max is no longer valid once the head is gone, so recompute.
  // A plain loop, never Math.max(...array), which throws on long arrays.
  let m = 0;
  for(let i=0;i<tr.sp.length;i++){ const v=tr.sp[i]; if(Number.isFinite(v) && v>m) m=v; }
  tr.maxSp = m;
}

function pushRaw(tr, line){
  tr.raw.push(line);
  if(tr.raw.length > RAW_CAP + TRIM_CHUNK){
    tr.raw.splice(0, TRIM_CHUNK);
    tr.rawCut = true;
  }
}

function resetLive(){
  const keep = liveTrace.circ;
  ["t","sp","cd","pw","wr","we","cr","ce","gr","markers","raw"]
    .forEach(k=>liveTrace[k].length = 0);
  liveTrace.maxSp = 0; liveTrace.wr0 = null; liveTrace.rawCut = false;
  liveTrace.header = null; liveTrace.cols = null; liveTrace.circ = keep;
}

/* ═══ column mapping ═════════════════════════════════════════════════════
   Every session writes its own header, so the header is the contract and
   the page does not need to know which firmware is flashed. A `tail` can
   start mid-log with no header in view, so width is the fallback:

     9 columns   gear-less        t,section,spd,cad,pwr,wr,we,cr,ce
    10 columns   gear, no ratio   t,section,gear,spd,cad,pwr,wr,we,cr,ce
    11 columns   rev H            ...as above plus trailing ratio        */
const LAYOUTS = {
  9:  ["t_s","section","speed_kmh","cadence_rpm","power_w","wheel_rev","wheel_evt","crank_rev","crank_evt"],
  10: ["t_s","section","gear","speed_kmh","cadence_rpm","power_w","wheel_rev","wheel_evt","crank_rev","crank_evt"],
  11: ["t_s","section","gear","speed_kmh","cadence_rpm","power_w","wheel_rev","wheel_evt","crank_rev","crank_evt","ratio"],
};

function colsFromHeader(line){
  const map = {};
  line.split(",").forEach((n,i)=>{ map[n.trim()] = i; });
  return ("t_s" in map && "speed_kmh" in map) ? map : null;
}
function colsFromWidth(n){
  const names = LAYOUTS[n];
  if(!names) return null;
  const map = {};
  names.forEach((k,i)=>{ map[k] = i; });
  return map;
}

/* A field that is absent, blank or garbled becomes NaN, and NaN is
   handled everywhere downstream rather than being allowed to propagate
   into an axis scale. */
function num(f, cols, key){
  const i = cols[key];
  if(i === undefined || i >= f.length) return NaN;
  const v = parseFloat(f[i]);
  return Number.isFinite(v) ? v : NaN;
}

function parseSample(f, cols){
  const t = num(f, cols, "t_s");
  if(!Number.isFinite(t)) return null;
  return {
    t,
    section: cols.section !== undefined ? f[cols.section] : "",
    gr: cols.gear !== undefined ? f[cols.gear] : "",
    sp: num(f, cols, "speed_kmh"),
    cd: num(f, cols, "cadence_rpm"),
    pw: num(f, cols, "power_w"),
    wr: num(f, cols, "wheel_rev"),
    we: num(f, cols, "wheel_evt"),
    cr: num(f, cols, "crank_rev"),
    ce: num(f, cols, "crank_evt"),
  };
}

/* ═══ environment ════════════════════════════════════════════════════════ */
(function checkEnv(){
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const show = html => { el.notice.innerHTML = html; el.notice.classList.remove("hide"); };
  if(!navigator.bluetooth){
    el.connect.disabled = true;
    show(iOS
      ? "<strong>This browser can't reach Bluetooth.</strong> Safari and Chrome on iOS don't implement Web Bluetooth. Open this page in <strong>Bluefy</strong> and it will work."
      : "<strong>This browser can't reach Bluetooth.</strong> Use Chrome, Edge or Opera on desktop or Android, over <code>https://</code> or <code>localhost</code>.");
    return;
  }
  if(!window.isSecureContext){
    el.connect.disabled = true;
    show("<strong>Insecure page.</strong> Web Bluetooth needs <code>https://</code> or <code>localhost</code>.");
  }
})();

/* ═══ log pane ═══════════════════════════════════════════════════════════ */
let logQueue = [], logPending = false;
function log(txt, cls){
  logQueue.push([txt, cls]);
  if(logPending) return;
  logPending = true;
  // Batched into one frame. A dump arriving line by line used to force a
  // layout per line, which is most of what "janky" meant.
  requestAnimationFrame(()=>{
    logPending = false;
    const frag = document.createDocumentFragment();
    for(const [t,c] of logQueue){
      const s = document.createElement("span");
      if(c) s.className = c;
      s.textContent = t + "\n";
      frag.appendChild(s);
    }
    logQueue.length = 0;
    el.log.appendChild(frag);
    while(el.log.childNodes.length > 400) el.log.removeChild(el.log.firstChild);
    el.log.scrollTop = el.log.scrollHeight;
  });
}

/* ═══ GATT write queue ═══════════════════════════════════════════════════
   One operation at a time, always. The chain never rejects, so a single
   failed write cannot wedge every command after it. */
const enc = new TextEncoder();
let gattChain = Promise.resolve();
function send(cmd){
  gattChain = gattChain.then(async ()=>{
    if(!rxChar) { log("not connected: " + cmd, "er"); return; }
    await rxChar.writeValue(enc.encode(cmd + "\n"));
    log("› " + cmd, "mk");
  }).catch(e=>{ log("send failed (" + cmd + "): " + e.message, "er"); });
  return gattChain;
}

/* ═══ connection ═════════════════════════════════════════════════════════ */
let dev = null, rxChar = null, txChar = null;
let recording = false, wantLink = false;
let retry = 0, retryTimer = null;

function setState(txt, cls){
  el.state.textContent = txt;
  el.dot.className = "dot" + (cls ? " " + cls : "");
}
function setLinked(on){
  [el.rec, el.mark, el.sec, el.free, el.tail, el.tail2, el.dump, el.erase,
   el.circ, el.gear, el.status, el.rescan, el.forget]
    .forEach(b=>{ b.disabled = !on; });
  el.connect.textContent = on ? "Disconnect" : "Connect";
  el.connect.classList.toggle("primary", !on);
}

el.connect.onclick = async ()=>{
  if(wantLink){ teardown(); return; }
  try{
    setState("Choosing…", "busy");
    dev = await navigator.bluetooth.requestDevice({
      filters:[{ namePrefix:"TL-1" }, { services:[NUS] }],
      optionalServices:[NUS],
    });
    dev.addEventListener("gattserverdisconnected", onDrop);
    wantLink = true; retry = 0;
    await openLink();
  }catch(e){
    wantLink = false;
    setState("Not connected");
    // NotFoundError just means the picker was dismissed. Not worth a line.
    if(e && e.name !== "NotFoundError") log("connect: " + e.message, "er");
  }
};

function teardown(){
  wantLink = false;
  clearTimeout(retryTimer);
  releaseWake();
  try{ if(dev && dev.gatt.connected) dev.gatt.disconnect(); }catch(e){}
  rxChar = txChar = null;
  setLinked(false);
  setState("Not connected");
  log("— disconnected —", "mk");
}

async function openLink(){
  setState("Connecting…", "busy");
  const gatt = await dev.gatt.connect();
  const svc  = await gatt.getPrimaryService(NUS);
  rxChar = await svc.getCharacteristic(NUS_RX);
  txChar = await svc.getCharacteristic(NUS_TX);
  txChar.addEventListener("characteristicvaluechanged", onData);
  await txChar.startNotifications();
  retry = 0;
  setState(dev.name || "TL-1", "live");
  setLinked(true);
  acquireWake();
  log("— linked to " + (dev.name || "TL-1") + " —", "mk");
  // Queued, so these are sent one after the other instead of colliding.
  send("status");
  send("free");
}

/* Exponential backoff, capped. iOS suspends the page when the screen
   locks or you switch apps, which drops the link every single time, so
   silent recovery matters more here than on desktop. */
function onDrop(){
  rxChar = txChar = null;
  setLinked(false);
  if(!wantLink){ setState("Not connected"); return; }
  const wait = Math.min(1000 * Math.pow(1.6, retry), 20000);
  retry++;
  if(retry > 30){
    wantLink = false;
    setState("Link lost", "bad");
    log("— gave up reconnecting, press Connect —", "er");
    return;
  }
  setState("Reconnecting " + retry, "busy");
  clearTimeout(retryTimer);
  retryTimer = setTimeout(async ()=>{
    if(!wantLink || !dev) return;
    if(dev.gatt.connected) return;
    try{ await openLink(); }catch(e){ onDrop(); }
  }, wait);
}

/* Screen wake lock, where it exists. Bluefy's WKWebView does not expose
   it, hence the guard rather than a feature promise. */
let wakeLock = null;
async function acquireWake(){
  try{
    if(!("wakeLock" in navigator)) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }catch(e){ /* denied or unsupported, nothing to do */ }
}
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible") return;
  if(wantLink && !wakeLock) acquireWake();
  if(wantLink && dev && !dev.gatt.connected){ retry = 0; onDrop(); }
});

/* ═══ receive ════════════════════════════════════════════════════════════ */
const dec = new TextDecoder();
let rxBuf = "";
function onData(ev){
  rxBuf += dec.decode(ev.target.value);
  // A notification can split a line anywhere, so only complete lines are
  // handled and the remainder waits. Guard against a peer that never
  // sends a newline, which would otherwise grow without bound.
  if(rxBuf.length > 8192) rxBuf = rxBuf.slice(-4096);
  let i;
  while((i = rxBuf.indexOf("\n")) >= 0){
    const line = rxBuf.slice(0, i).replace(/\r$/, "");
    rxBuf = rxBuf.slice(i + 1);
    try{ handleLine(line); }
    catch(e){ log("parse error: " + e.message, "er"); }
  }
}

/* ---- bulk import ---- */
let imp = null;   // {lines:[], got:0, expected:0}

function handleLine(line){
  /* ---- import framing ----
     Checked first. A dump replays old console output, including stale
     "[flash] N of M bytes" lines, and letting those reach the scrapers
     below would repaint the live gauge with numbers from last week. */
  if(/^# BEGIN/.test(line)){
    const n = line.match(/(\d+) bytes/);
    imp = { lines:[], got:0, expected: n ? +n[1] : 0 };
    el.flashTxt.textContent = "loading…";
    log(line, "mk");
    return;
  }
  if(imp){
    if(/^# END/.test(line)){
      log("# END, " + imp.got + " bytes received", "mk");
      finishImport();
      return;
    }
    imp.got += line.length + 1;
    imp.lines.push(line);
    // Progress every 200 lines, not every line.
    if(imp.expected && (imp.lines.length % 200) === 0)
      el.flashTxt.textContent = "loading " +
        (100 * imp.got / imp.expected).toFixed(0) + "%  (" +
        (imp.got / 1024).toFixed(0) + " of " + (imp.expected / 1024).toFixed(0) + " KB)";
    return;
  }

  /* ---- live scrapes, now that we know this is not imported data ---- */
  const fu = line.match(/(\d+) of (\d+) bytes/);
  if(fu){ flashUsed = +fu[1]; flashTotal = +fu[2]; paintFlash(); }
  const cm = line.match(/circ[= ]+(\d+)\s*mm/i);
  if(cm) liveTrace.circ = +cm[1];
  const bm = line.match(/\bbat(?:tery)?[= ]+(\d+)\s*%/i);
  if(bm) paintBattery(+bm[1]);

  /* ---- markers ---- */
  if(line[0] === "#"){
    log(line, "mk");
    if(/^# SESSION START/.test(line)){
      resetLive();
      pushRaw(liveTrace, line);
      recording = true; syncRec(); backToLive();
      liveTrace.markers.push({ t:0, kind:"session", text:"start" });
    } else if(/^# SESSION STOP/.test(line)){
      recording = false; syncRec();
      pushRaw(liveTrace, line);
      send("free");
    } else {
      pushRaw(liveTrace, line);
      const m = line.match(/^# (SECTION|GEAR|MARK)\s*(\S*)/);
      if(m){
        const tm = line.match(/t=([\d.]+)s/);
        const last = liveTrace.t.length ? liveTrace.t[liveTrace.t.length - 1] : 0;
        liveTrace.markers.push({
          t: tm ? parseFloat(tm[1]) : last,
          kind: m[1].toLowerCase(),
          text: m[1] === "GEAR" ? ((line.match(/(\d+x\d+)/) || [])[1] || "none") : m[2],
        });
      }
    }
    dirty = true;
    return;
  }

  /* ---- header line ---- */
  if(/^t_s\s*,/.test(line)){
    const c = colsFromHeader(line);
    if(c){ liveTrace.cols = c; liveTrace.header = line; }
    pushRaw(liveTrace, line);
    log(line);
    return;
  }

  /* ---- sample row ---- */
  if(/^[\d.]+,/.test(line)){
    const f = line.split(",");
    const cols = liveTrace.cols || colsFromWidth(f.length);
    if(cols){
      const s = parseSample(f, cols);
      if(s){
        if(!liveTrace.cols) liveTrace.cols = cols;   // inferred from width
        pushSample(liveTrace, s, LIVE_CAP);
        pushRaw(liveTrace, line);
        el.save.disabled = false;
        if(!recording){ recording = true; syncRec(); }
        if(mode === "live"){
          paintReadout(s);
          if(follow) viewEnd = s.t;
          dirty = true;
        }
        return;
      }
    }
  }

  /* ---- idle status line ---- */
  if(!line) return;
  log(line);
  // Fields parsed one at a time. v2 used a single combined regex that
  // required a ratio field, so the whole line stopped matching the moment
  // the firmware dropped it.
  const sp = line.match(/spd=(-?[\d.]+)/);
  const cd = line.match(/cad=(-?[\d.]+)/);
  const pw = line.match(/P=(-?\d+)\s*W/);
  if(sp && cd && mode === "live")
    paintReadout({ sp:+sp[1], cd:+cd[1], pw: pw ? +pw[1] : NaN });
}

/* ═══ readout ════════════════════════════════════════════════════════════ */
const fmt1 = v => Number.isFinite(v) ? v.toFixed(1) : "––";
const fmt0 = v => Number.isFinite(v) ? String(Math.round(v)) : "––";

function paintReadout(s){
  el.speed.textContent = fmt1(s.sp);
  el.cad.textContent   = fmt0(s.cd);
  el.pwr.textContent   = (Number.isFinite(s.pw) && s.pw !== 0) ? fmt0(s.pw) : "––";
  paintCounters();
}

function paintCounters(){
  const tr = T();
  const n = tr.t.length;
  el.pts.textContent = n ? String(n) : "0";
  const t = n ? tr.t[n - 1] : 0;
  el.time.textContent = Math.floor(t / 60) + ":" +
                        String(Math.floor(t % 60)).padStart(2, "0");
  const circ = (tr.circ || liveTrace.circ || 2100) / 1000;
  const last = n ? tr.wr[n - 1] : NaN;
  el.dist.textContent = (Number.isFinite(last) && Number.isFinite(tr.wr0))
    ? Math.round((last - tr.wr0) * circ).toLocaleString()
    : "0";
}

function paintBattery(pct){
  el.bat.classList.remove("hide");
  el.bat.textContent = pct + "%";
  el.bat.classList.toggle("low", pct <= 20);
}

/* ═══ flash panel ════════════════════════════════════════════════════════ */
let flashUsed = null, flashTotal = null;

function paintFlash(){
  if(flashUsed === null){ el.flashTxt.textContent = "not read yet"; return; }
  const kb  = v => (v / 1024).toFixed(0);
  const pct = flashTotal ? (100 * flashUsed / flashTotal) : 0;
  // 48 bytes a line at 4 Hz, matching the gear-less format. Older sessions
  // ran about 62, so this reads slightly optimistic against an old log.
  const mins = ((flashTotal - flashUsed) / (48 * 4)) / 60;
  el.flashTxt.textContent = kb(flashUsed) + " of " + kb(flashTotal) + " KB used (" +
    pct.toFixed(1) + "%) · about " + mins.toFixed(0) + " min free";
  el.gaugeFill.style.width = Math.min(100, pct).toFixed(2) + "%";
  el.gaugeFill.style.background = pct > 90 ? "var(--sprint)" : "var(--stayer)";
}

/* Split imported text into sessions. A `tail` starts mid-log, so the first
   chunk is normally a fragment; it is kept and labelled as one rather than
   thrown away, because a fragment is often the ride you just did. */
function parseSessions(lines){
  const out = [];
  let cur = null;
  const start = header =>{
    cur = newTrace(header ? "session" : "fragment");
    cur.header = null; cur.cols = null;
    cur.startLine = header;
    out.push(cur);
  };
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;                       // page padding
    if(/^# SESSION START/.test(line)){
      start(line);
      pushRaw(cur, line);
      const cm = line.match(/circ=(\d+)mm/);
      if(cm) cur.circ = +cm[1];
      continue;
    }
    if(!cur) start(null);
    pushRaw(cur, line);

    if(/^t_s\s*,/.test(line)){
      const c = colsFromHeader(line);
      if(c){ cur.cols = c; cur.header = line; }
      continue;
    }
    if(line[0] === "#"){
      const m = line.match(/^# (SECTION|GEAR|MARK)\s*(\S*)/);
      if(m){
        const tm = line.match(/t=([\d.]+)s/);
        cur.markers.push({
          t: tm ? parseFloat(tm[1]) : 0, kind: m[1].toLowerCase(),
          text: m[1] === "GEAR" ? ((line.match(/(\d+x\d+)/) || [])[1] || "none") : m[2],
        });
      }
      continue;
    }
    if(!/^[\d.]+,/.test(line)) continue;      // console noise in the log
    const f = line.split(",");
    const cols = cur.cols || colsFromWidth(f.length);
    if(!cols) continue;
    const s = parseSample(f, cols);
    if(s) pushSample(cur, s, REVIEW_CAP);
  }
  return out.filter(s=>s.t.length > 1);
}

function finishImport(){
  const lines = imp.lines;
  imp = null;                                 // drop the reference first
  const sessions = parseSessions(lines);
  lines.length = 0;                           // and free the strings
  paintFlash();
  showSessions(sessions);
}

function showSessions(sessions){
  el.sessions.innerHTML = "";
  if(!sessions.length){
    el.sessions.classList.add("hide");
    log("no complete sessions in that data", "er");
    return;
  }
  el.sessions.classList.remove("hide");
  el.dFlash.open = true;

  sessions.forEach((s, i)=>{
    const dur = s.t[s.t.length - 1] - s.t[0];
    const gear = s.startLine ? ((s.startLine.match(/gear=(\S+)/) || [])[1] || null) : null;
    const b = document.createElement("button");
    b.innerHTML = (s.startLine ? "Session " + (i + 1) : "Fragment") +
      "<small>" + dur.toFixed(0) + " s · " + s.t.length + " pts · top " +
      s.maxSp.toFixed(1) + " km/h" + (gear && gear !== "-" ? " · " + gear : "") +
      "</small>";
    b.onclick = ()=>{
      reviewTrace = s; mode = "review";
      [...el.sessions.children].forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      el.reviewRow.classList.remove("hide");
      el.reviewTxt.textContent = "Reviewing " +
        (s.startLine ? "session " + (i + 1) : "fragment") + ", " + s.t.length + " samples";
      el.badge.textContent = "Review";
      viewSpan = Math.max(10, dur * 1.05);
      viewEnd  = s.t[s.t.length - 1];
      follow = false; el.follow.classList.remove("on");
      el.save.disabled = false;
      paintCounters();
      dirty = true;
    };
    el.sessions.appendChild(b);
  });
  log(sessions.length + " session(s) parsed, pick one to plot", "mk");
}

function backToLive(){
  mode = "live"; reviewTrace = null;
  el.reviewRow.classList.add("hide");
  [...el.sessions.children].forEach(x=>x.classList.remove("on"));
  el.badge.textContent = "Live";
  follow = true; el.follow.classList.add("on");
  if(liveTrace.t.length) viewEnd = liveTrace.t[liveTrace.t.length - 1];
  paintCounters();
  dirty = true;
}
el.backLive.onclick = backToLive;

/* ═══ controls ═══════════════════════════════════════════════════════════ */
function syncRec(){
  el.rec.textContent = recording ? "Stop" : "Record";
  el.rec.classList.toggle("primary", !recording);
  el.rec.classList.toggle("on", recording);
}
el.rec.onclick    = ()=> send(recording ? "stop" : "start");
el.mark.onclick   = ()=> send("mark");
el.status.onclick = ()=> send("status");
el.rescan.onclick = ()=> send("rescan");
el.free.onclick   = ()=> send("free");
el.tail.onclick   = ()=> send("tail 32");
el.tail2.onclick  = ()=> send("tail 128");

el.sec.onclick = ()=>{
  const n = (el.secName.value || "").trim().replace(/\s+/g, "_");
  if(!n){ el.secName.focus(); return; }
  send("sec " + n);
  el.secName.blur();
};
el.secName.addEventListener("keydown", e=>{ if(e.key === "Enter") el.sec.click(); });

el.circ.onclick = ()=>{
  const v = parseInt(el.circVal.value, 10);
  if(!(v > 500 && v < 3000)){ el.circVal.focus(); return; }
  send("circ " + v); liveTrace.circ = v; el.circVal.blur();
};
el.gear.onclick = ()=>{
  const v = (el.gearVal.value || "").trim();
  if(!/^\d+(\s+\d+)?$/.test(v)){ el.gearVal.focus(); return; }
  send("gear " + v); el.gearVal.blur();
};

/* Two-tap arming instead of a native confirm dialog. A modal in a
   WKWebView blocks the whole page, and on a phone at the track a mistaken
   erase is the one thing worth guarding properly. */
function arm(btn, label, action, ms){
  let armed = false, timer = null;
  const reset = ()=>{
    armed = false; clearTimeout(timer);
    btn.textContent = label; btn.classList.remove("armed");
  };
  btn.onclick = ()=>{
    if(!armed){
      armed = true;
      btn.textContent = "Tap again";
      btn.classList.add("armed");
      timer = setTimeout(reset, ms || 4000);
      return;
    }
    reset();
    action();
  };
  return reset;
}

arm(el.erase, "Erase log", ()=>{
  send("erase yes");
  el.flashTxt.textContent = "erasing, about 20 s…";
  setTimeout(()=>send("free"), 25000);
});
arm(el.forget, "Forget MACs", ()=> send("forget"));
arm(el.dump, "Load all", ()=>{
  const kb = flashUsed ? flashUsed / 1024 : 0;
  const mins = kb / BLE_KB_S / 60;
  log("loading the whole log, roughly " + (mins < 1 ? "under a minute" :
      mins.toFixed(0) + " min") + " over Bluetooth", "mk");
  send("dump");
}, 6000);

el.save.onclick = ()=>{
  const tr = T();
  if(!tr.raw.length){ log("nothing to save yet", "er"); return; }
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  const tag = mode === "review" ? "flash" : "live";
  const head = tr.rawCut
    ? "# NOTE: this page trimmed its oldest lines to stay within memory.\n" +
      "# The complete session is still on the logger, use dump or tail.\n" : "";
  const blob = new Blob([head + tr.raw.join("\n") + "\n"], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "tl1-" + tag + "-" + stamp + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
};

/* Open a CSV saved earlier, so a session can be reviewed at home with no
   logger in the room. It is the same parser the live import uses, so
   anything the logger can produce can be read back. */
el.open.onclick = ()=> el.fileIn.click();
el.fileIn.onchange = async ()=>{
  const f = el.fileIn.files && el.fileIn.files[0];
  if(!f) return;
  try{
    const text = await f.text();
    const lines = text.split("\n");
    log("opened " + f.name + ", " + lines.length + " lines", "mk");
    imp = null;
    showSessions(parseSessions(lines));
  }catch(e){ log("could not read that file: " + e.message, "er"); }
  el.fileIn.value = "";
};

/* ═══ graph ══════════════════════════════════════════════════════════════ */
let follow = true, viewSpan = 120, viewEnd = 0, cursor = null, dirty = true;

el.out.onclick = ()=>{ viewSpan = Math.min(viewSpan * 2, 7200); dirty = true; };
el.in.onclick  = ()=>{ viewSpan = Math.max(viewSpan / 2, 5);    dirty = true; };
el.follow.onclick = ()=>{
  follow = !follow;
  el.follow.classList.toggle("on", follow);
  const tr = T();
  if(follow && tr.t.length) viewEnd = tr.t[tr.t.length - 1];
  dirty = true;
};

const cv = el.cv, ctx = cv.getContext("2d");
// PAD.t has to clear the overlay row of zoom buttons, or they sit on top
// of the trace. PAD.b clears the time labels.
const PAD = { l:40, r:40, t:52, b:26 };
let W = 0, H = 0;

/* getComputedStyle is not cheap and v2 called it a dozen times per frame.
   Read the palette once; nothing here changes it at runtime. */
const C = (()=>{
  const g = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return { rail:g("--rail"), pine:g("--pine"), dim:g("--dim"),
           sprint:g("--sprint"), stayer:g("--stayer") };
})();
const FONT_MONO = '500 10px ui-monospace, Menlo, monospace';
const FONT_UI   = '14px system-ui, -apple-system, sans-serif';

function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap: 3x on a
  W = Math.max(1, Math.round(r.width));                    // phone is a lot
  H = Math.max(1, Math.round(r.height));                   // of pixels to
  cv.width = Math.round(W * dpr);                          // fill at 60 fps
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dirty = true;
}
new ResizeObserver(resize).observe(cv);

/* First index with t >= v. Samples are appended in time order within a
   session, so a binary search is valid and keeps a two-hour view cheap. */
function lowerBound(a, v){
  let lo = 0, hi = a.length;
  while(lo < hi){ const m = (lo + hi) >> 1; if(a[m] < v) lo = m + 1; else hi = m; }
  return lo;
}

/* One min/max pair per pixel column once there is more than about one
   sample per pixel. Below that threshold the points are drawn directly,
   so a short view still looks like a line rather than an envelope. */
function strokeSeries(tr, arr, X, Y, colour, i0, i1, pw){
  ctx.strokeStyle = colour; ctx.lineWidth = 2; ctx.lineJoin = "round";
  ctx.beginPath();
  const n = i1 - i0;
  if(n <= pw * 1.4){
    let pen = false;
    for(let i = i0; i < i1; i++){
      const v = arr[i];
      if(!Number.isFinite(v)){ pen = false; continue; }   // break, don't bridge
      const x = X(tr.t[i]), y = Y(v);
      if(pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; }
    }
  }else{
    let px = -1, lo = 0, hi = 0, pen = false;
    const flush = ()=>{
      if(px < 0) return;
      if(pen){ ctx.lineTo(px, Y(lo)); } else { ctx.moveTo(px, Y(lo)); pen = true; }
      ctx.lineTo(px, Y(hi));
    };
    for(let i = i0; i < i1; i++){
      const v = arr[i];
      if(!Number.isFinite(v)) continue;
      const cx = Math.round(X(tr.t[i]));
      if(cx !== px){ flush(); px = cx; lo = hi = v; }
      else { if(v < lo) lo = v; if(v > hi) hi = v; }
    }
    flush();
  }
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  const pw = W - PAD.l - PAD.r, ph = H - PAD.t - PAD.b;
  if(pw < 20 || ph < 20) return;

  const tr = T();
  const t1 = viewEnd || viewSpan, t0 = t1 - viewSpan;

  // Running max, already finite-filtered, so one bad row cannot blank the
  // chart the way it did in v2. Rounded to a multiple of 20 so the four
  // gridline labels are whole numbers: a 68.85 top speed rounded to 70
  // gave an axis reading 0 / 18 / 35 / 53 / 70, which is unreadable at a
  // glance and the glance is the whole point on a bike.
  const maxSpd = Math.max(60, Math.ceil(Math.max(10, tr.maxSp) / 20) * 20);
  const maxCad = 200;
  const X = t => PAD.l + ((t - t0) / viewSpan) * pw;
  const Ys = v => PAD.t + ph - (v / maxSpd) * ph;
  const Yc = v => PAD.t + ph - (v / maxCad) * ph;

  ctx.font = FONT_MONO;
  ctx.lineWidth = 1;
  for(let i = 0; i <= 4; i++){
    const y = PAD.t + ph - (i / 4) * ph;
    ctx.strokeStyle = C.rail;
    ctx.globalAlpha = i === 0 ? .9 : .32;
    ctx.beginPath(); ctx.moveTo(PAD.l, y + .5); ctx.lineTo(PAD.l + pw, y + .5); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.sprint; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(String(Math.round(maxSpd * i / 4)), PAD.l - 6, y);
    ctx.fillStyle = C.stayer; ctx.textAlign = "left";
    ctx.fillText(String(Math.round(maxCad * i / 4)), PAD.l + pw + 6, y);
  }

  const step = viewSpan <= 30 ? 5 : viewSpan <= 120 ? 15 : viewSpan <= 600 ? 60
             : viewSpan <= 1800 ? 300 : 600;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for(let t = Math.ceil(t0 / step) * step; t <= t1; t += step){
    const x = X(t);
    ctx.strokeStyle = C.rail; ctx.globalAlpha = .2;
    ctx.beginPath(); ctx.moveTo(x + .5, PAD.t); ctx.lineTo(x + .5, PAD.t + ph); ctx.stroke();
    ctx.globalAlpha = 1; ctx.fillStyle = C.dim;
    ctx.fillText(Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0"),
                 x, PAD.t + ph + 5);
  }

  for(const mk of tr.markers){
    if(mk.t < t0 || mk.t > t1) continue;
    const x = X(mk.t);
    const strong = mk.kind === "gear" || mk.kind === "section";
    ctx.strokeStyle = strong ? C.pine : C.dim;
    ctx.globalAlpha = .5; ctx.setLineDash(strong ? [] : [3, 3]);
    ctx.beginPath(); ctx.moveTo(x + .5, PAD.t); ctx.lineTo(x + .5, PAD.t + ph); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(x + 4, PAD.t + 4); ctx.rotate(Math.PI / 2);
    ctx.fillStyle = strong ? C.pine : C.dim;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(mk.text || mk.kind, 0, 0);
    ctx.restore();
  }

  const i0 = lowerBound(tr.t, t0 - 1);
  const i1 = lowerBound(tr.t, t1 + 1);
  if(i1 - i0 > 1){
    strokeSeries(tr, tr.cd, X, Yc, C.stayer, i0, i1, pw);
    strokeSeries(tr, tr.sp, X, Ys, C.sprint, i0, i1, pw);
  }else if(!tr.t.length){
    ctx.fillStyle = C.dim; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = FONT_UI;
    ctx.fillText(mode === "review" ? "Pick a session." : "Press Record.",
                 PAD.l + pw / 2, PAD.t + ph / 2);
    return;
  }

  if(cursor !== null && i1 > i0){
    const tc = t0 + ((cursor - PAD.l) / pw) * viewSpan;
    let k = lowerBound(tr.t, tc);
    if(k >= i1) k = i1 - 1;
    if(k > i0 && Math.abs(tr.t[k - 1] - tc) < Math.abs(tr.t[k] - tc)) k--;
    const x = X(tr.t[k]);
    ctx.font = FONT_MONO;
    ctx.strokeStyle = C.pine; ctx.globalAlpha = .45; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + .5, PAD.t); ctx.lineTo(x + .5, PAD.t + ph); ctx.stroke();
    ctx.globalAlpha = 1;
    const marks = [];
    if(Number.isFinite(tr.sp[k])) marks.push([fmt1(tr.sp[k]) + " km/h", C.sprint, Ys(tr.sp[k])]);
    if(Number.isFinite(tr.cd[k])) marks.push([fmt0(tr.cd[k]) + " rpm",  C.stayer, Yc(tr.cd[k])]);
    for(const [txt, col, y] of marks){
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 6.2832); ctx.fill();
      const flip = x > PAD.l + pw - 86;
      ctx.textAlign = flip ? "right" : "left"; ctx.textBaseline = "bottom";
      ctx.fillText(txt, x + (flip ? -8 : 8), y - 6);
    }
    const t = tr.t[k];
    ctx.fillStyle = C.pine; ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText(Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0"),
                 x, PAD.t + ph + 5);
  }
}

/* ---- pan, zoom, scrub ---- */
let drag = null, pinch = null;
cv.addEventListener("pointerdown", e=>{
  cv.setPointerCapture(e.pointerId);
  drag = { x:e.offsetX, end:viewEnd };
});
cv.addEventListener("pointermove", e=>{
  cursor = e.offsetX;
  if(drag){
    const pw = W - PAD.l - PAD.r;
    viewEnd = drag.end - ((e.offsetX - drag.x) / pw) * viewSpan;
    if(follow){ follow = false; el.follow.classList.remove("on"); }
  }
  dirty = true;
});
const endDrag = ()=>{ drag = null; };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("pointerleave", ()=>{ cursor = null; dirty = true; });
cv.addEventListener("wheel", e=>{
  e.preventDefault();
  viewSpan = Math.min(7200, Math.max(5, viewSpan * (e.deltaY > 0 ? 1.2 : 1 / 1.2)));
  dirty = true;
}, { passive:false });

/* Two-finger pinch to zoom the time axis. */
cv.addEventListener("touchstart", e=>{
  if(e.touches.length === 2){
    drag = null;
    pinch = { d:Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY), span:viewSpan };
  }
}, { passive:true });
cv.addEventListener("touchmove", e=>{
  if(pinch && e.touches.length === 2){
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if(d > 8) viewSpan = Math.min(7200, Math.max(5, pinch.span * (pinch.d / d)));
    dirty = true;
  }
}, { passive:true });
cv.addEventListener("touchend", ()=>{ pinch = null; }, { passive:true });

/* One draw per frame at most, and only when something changed. */
(function tick(){
  if(dirty){ dirty = false; draw(); }
  requestAnimationFrame(tick);
})();

/* ═══ offline ════════════════════════════════════════════════════════════
   So the page opens at the track with no signal, and so adding it to the
   home screen gives a real standalone app rather than a browser shell
   that reloads when iOS reclaims memory. */
if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* A small hook for testing and for replaying a log by hand from the
   console, e.g.  TL1.feed("0.25,main,41.0,102,0,1000,256,200,300")
   It is the same entry point the radio uses, so anything that works here
   works over Bluetooth. */
window.TL1 = {
  feed: handleLine,
  feedText: t => t.split("\n").forEach(l=>handleLine(l.replace(/\r$/, ""))),
  parseSessions, showSessions,
  get live(){ return liveTrace; },
  get shown(){ return T(); },
};

resize(); syncRec(); paintFlash(); paintCounters();
</script>
